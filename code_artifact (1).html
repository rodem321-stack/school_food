            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-4 drop-shadow-sm">

        </div>
    </header>

                            <option value="동탄">동탄 전역</option>
                            <option value="반송동">반송동</option>
                            <option value="석우동">석우동</option>

                            <option value="향남">향남읍</option>
                            <option value="봉담">봉담읍</option>
                            <option value="남양">남양읍</option>

            { 시도교육청코드: "J10", 시도교육청명: "경기도교육청", 행정구역명: "화성시", 읍면동: "남양읍", 학원교습소명: "학원", 학원지정번호: "3000080808", 학원명: "남양에듀학원", 분야명: "입시·검정", 교습과정목록명: "대입 수능 및 내신 종합", 대상학교급: "고등", 도로명주소: "경기도 화성시 남양읍 남양로 839", 전화번호: "031-356-8888" },
            { 시도교육청코드: "J10", 시도교육청명: "경기도교육청", 행정구역명: "화성시", 읍면동: "반송동", 학원교습소명: "교습소", 학원지정번호: "3000090909", 학원명: "푸른숲발레교습소", 분야명: "예능", 교습과정목록명: "유아발레, 초등발레, 취미발레", 대상학교급: "초등,중등", 도로명주소: "경기도 화성시 반송동 104-3", 전화번호: "031-613-9999" }
        ];

        const CONFIG_PAGE_SIZE = 6;

        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        let selectedTargetLevel = "";

        const districtSelect = document.getElementById('districtSelect');
        const keywordInput = document.getElementById('keywordInput');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sortSelect = document.getElementById('sortSelect');
        const resultContainer = document.getElementById('resultContainer');
        const resultCount = document.getElementById('resultCount');
        const paginationContainer = document.getElementById('paginationContainer');
        const targetFilterGroup = document.getElementById('targetFilterGroup');
        
        const detailModal = document.getElementById('detailModal');
        const modalClose = document.getElementById('modalClose');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalAcademyName = document.getElementById('modalAcademyName');
        const modalBadge = document.getElementById('modalBadge');
        const modalBody = document.getElementById('modalBody');

        searchBtn.addEventListener('click', handleSearch);
        resetBtn.addEventListener('click', handleReset);
        sortSelect.addEventListener('change', handleSortAndRender);
        keywordInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleSearch(); });

        // 학교급 필터 버튼 이벤트 처리
        targetFilterGroup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                targetFilterGroup.querySelectorAll('button').forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
                });
                const targetBtn = e.currentTarget;
                targetBtn.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
                targetBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');

                selectedTargetLevel = targetBtn.getAttribute('data-target');
                handleSearch();
            });
        });

        const closeModal = () => { detailModal.classList.add('hidden'); detailModal.classList.remove('flex'); };
        modalClose.addEventListener('click', closeModal);
        modalCloseBtn.addEventListener('click', closeModal);
        window.addEventListener('click', (e) => { if (e.target === detailModal) closeModal(); });

        window.addEventListener('DOMContentLoaded', () => {
            loadInitialData();
        });

        function showCustomMessage(msg) {
            modalAcademyName.textContent = "알림";
            modalBadge.textContent = "SYSTEM";
            modalBody.innerHTML = `<p class="py-4 text-center text-slate-700 font-semibold">${msg}</p>`;
            detailModal.classList.remove('hidden');
            detailModal.classList.add('flex');
        }

        function loadInitialData() {
            allData = RAW_DATASET;
            filteredData = [...allData];
            handleSortAndRender();
        }

        function handleSearch() {
            const selectedDistrict = districtSelect.value;
            const keyword = keywordInput.value.trim().toLowerCase();

            filteredData = allData.filter(item => {
                const dongVal = item.읍면동 || "";
                const addressVal = item.도로명주소 || "";
                
                let matchDistrict = true;
                if (selectedDistrict === "동탄") {
                    matchDistrict = dongVal.includes("동탄") || dongVal.includes("반송") || dongVal.includes("석우") || dongVal.includes("청계") || dongVal.includes("영천") || dongVal.includes("오산") || addressVal.includes("동탄");
                } else if (selectedDistrict) {
                    matchDistrict = dongVal.includes(selectedDistrict) || addressVal.includes(selectedDistrict);
                }
                
                const academyName = (item.학원명 || "").toLowerCase();
                const fieldName = (item.분야명 || "").toLowerCase();
                const courseList = (item.교습과정목록명 || "").toLowerCase();

                const keywords = keyword ? keyword.split(/\s+/) : [];
                const matchKeyword = keywords.length === 0 || keywords.every(kw => 
                    academyName.includes(kw) || 
                    fieldName.includes(kw) || 
                    courseList.includes(kw)
                );

                const targetLevel = item.대상학교급 || "";
                const matchTarget = !selectedTargetLevel || targetLevel.includes(selectedTargetLevel);

                return matchDistrict && matchKeyword && matchTarget;
            });

            currentPage = 1;
            handleSortAndRender();
        }

        function handleReset() {
            districtSelect.value = "";
            keywordInput.value = "";
            selectedTargetLevel = "";
            
            targetFilterGroup.querySelectorAll('button').forEach((b, idx) => {
                if (idx === 0) {
                    b.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
                    b.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
                } else {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
                }
            });

            filteredData = [...allData];
            currentPage = 1;
            handleSortAndRender();
        }

        function handleSortAndRender() {
            const sortBy = sortSelect.value;
            filteredData.sort((a, b) => {
                if (sortBy === 'name') return (a.학원명 || "").localeCompare(b.학원명 || "");
                if (sortBy === 'dong') return (a.읍면동 || "").localeCompare(b.읍면동 || "");
                return 0;
            });

            renderResults();
            renderPagination();
        }

        function renderResults() {
            resultCount.innerHTML = `검색 결과 <span class="text-indigo-600 font-bold">${filteredData.length}</span>건`;

            if (filteredData.length === 0) {
                resultContainer.innerHTML = `
                    <div class="col-span-full bg-white rounded-3xl p-16 text-center text-slate-400 border border-slate-100 shadow-sm font-medium">
                        선택하신 조건에 일치하는 화성시 학원이 없습니다.
                    </div>`;
                paginationContainer.innerHTML = '';
                return;
            }

            const startIndex = (currentPage - 1) * CONFIG_PAGE_SIZE;
            const endIndex = startIndex + CONFIG_PAGE_SIZE;
            const paginatedItems = filteredData.slice(startIndex, endIndex);

            resultContainer.innerHTML = '';
            paginatedItems.forEach(item => {
                const targets = (item.대상학교급 || "초등,중등,고등").split(',').map(t => `<span class="bg-indigo-50/80 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded">${t.trim()}부</span>`).join(' ');

                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl border border-slate-100 p-6 shadow-sm hover:shadow-xl hover:border-indigo-200 transition-all cursor-pointer flex flex-col justify-between group relative overflow-hidden';
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-50/50 rounded-bl-full -z-0 group-hover:scale-110 transition-transform"></div>
                    <div class="relative z-10">
                        <div class="flex items-center justify-between mb-3">
                            <span class="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-lg shadow-sm">${item.학원교습소명 || '구분'}</span>
                            <div class="flex items-center gap-1">${targets}</div>
                        </div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition-colors">${item.학원명 || '정보 없음'}</h3>
                        <p class="text-xs font-medium text-slate-500 mb-2"><strong>지역:</strong> ${item.읍면동 || '화성시'} | <strong>분야:</strong> ${item.분야명 || '일반'}</p>
                        <p class="text-xs text-slate-500 line-clamp-2"><strong>과정:</strong> ${item.교습과정목록명 || '-'}</p>
                    </div>
                    <div class="pt-4 mt-5 border-t border-slate-100 flex items-center justify-between text-xs font-semibold text-slate-400 relative z-10">
                        <span class="truncate pr-2">${item.도로명주소 || '경기도 화성시'}</span>
                        <span class="text-indigo-600 font-bold whitespace-nowrap group-hover:translate-x-1 transition-transform">상세보기 &rarr;</span>
                    </div>
                `;
                card.addEventListener('click', () => openDetailModal(item));
                resultContainer.appendChild(card);
            });
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredData.length / CONFIG_PAGE_SIZE);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `w-11 h-11 rounded-2xl font-bold text-sm transition-all shadow-sm ${i === currentPage ? 'bg-indigo-600 text-white shadow-indigo-500/30' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`;
                btn.textContent = i;
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderResults();
                    window.scrollTo({ top: 250, behavior: 'smooth' });
                });
                paginationContainer.appendChild(btn);
            }
        }

        function openDetailModal(item) {
            modalAcademyName.textContent = item.학원명 || '학원 상세 정보';
            modalBadge.textContent = item.학원교습소명 || '구분';
            modalBody.innerHTML = `
                <div class="flex justify-between py-2 border-b border-slate-200/60 text-sm">
                    <span class="text-slate-500 font-medium">지역(읍·면·동)</span>
                    <span class="text-slate-900 font-semibold">${item.읍면동 || '화성시'}</span>
                </div>
                <div class="flex justify-between py-2 border-b border-slate-200/60 text-sm">
                    <span class="text-slate-500 font-medium">대상 학교급</span>
                    <span class="text-indigo-600 font-bold">${item.대상학교급 || '전체'}</span>
                </div>
                <div class="flex justify-between py-2 border-b border-slate-200/60 text-sm">
                    <span class="text-slate-500 font-medium">학원지정번호</span>
                    <span class="text-slate-900 font-semibold">${item.학원지정번호 || '-'}</span>
                </div>
                <div class="flex justify-between py-2 border-b border-slate-200/60 text-sm">
                    <span class="text-slate-500 font-medium">교육 분야</span>
                    <span class="text-slate-900 font-semibold">${item.분야명 || '종합'}</span>
                </div>
                <div class="flex justify-between py-2 border-b border-slate-200/60 text-sm">
                    <span class="text-slate-500 font-medium">교습과정</span>
                    <span class="text-slate-900 font-semibold text-right">${item.교습과정목록명 || '-'}</span>
                </div>
                <div class="flex justify-between py-2 border-b border-slate-200/60 text-sm">
                    <span class="text-slate-500 font-medium">도로명 주소</span>
                    <span class="text-slate-900 font-semibold text-right">${item.도로명주소 || '경기도 화성시'}</span>
                </div>
                <div class="flex justify-between py-2 text-sm">
                    <span class="text-slate-500 font-medium">연락처</span>
                    <span class="text-indigo-600 font-semibold">${item.전화번호 || '정보 없음'}</span>
                </div>
            `;
            detailModal.classList.remove('hidden');
            detailModal.classList.add('flex');
        }
    </script>
</body>
</html>
